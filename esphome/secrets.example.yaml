# Copy into your ESPHome secrets.yaml (ESPHome dashboard -> SECRETS) and fill in.
wifi_ssid: "YourWiFi"
wifi_password: "YourWiFiPassword"
# 32-byte base64 key, e.g. from https://esphome.io/components/api#configuration-variables
bedroom_panel_api_key: "REPLACE_ME"
bedroom_panel_ota_password: "REPLACE_ME"
# /local path HA writes the shrunk camera snapshots to (folder under /config/www,
# use a random name so it can't be guessed)
panel_cam_path: "/local/panel_CHANGE_ME_RANDOM"
