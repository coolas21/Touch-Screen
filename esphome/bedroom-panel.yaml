# Bedroom touch panel - Hosyond 4.0" ESP32-32E (ESP32-D0WD-V3, no PSRAM),
# ST7796S 320x480 SPI LCD + XPT2046 resistive touch.
# Pinout: https://www.lcdwiki.com/4.0inch_ESP32-32E_Display
#
# Tabs: Home (clock, weather, room temps, bedroom controls) | Scenes |
# Doors (garage 1-3 with confirm) | Reset (direct HTTP Restart to Tasmota
# devices, works even if HA/MQTT is down) | Setup.
#
# HA side: scripts in /homeassistant/packages/bedroom_panel.yaml. After
# adopting the device in HA, enable "Allow the device to perform Home
# Assistant actions" in the ESPHome integration's device options, or the
# scene/door/light buttons do nothing.

substitutions:
  name: bedroom-panel
  # private /local folder where HA writes the shrunk snapshots (in secrets.yaml)
  cam_path: !secret panel_cam_path
  friendly_name: Bedroom Panel

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - script.execute: apply_theme

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret bedroom_panel_api_key
  on_client_connected:
    - lvgl.widget.hide: badge_no_ha
  on_client_disconnected:
    - lvgl.widget.show: badge_no_ha

ota:
  - platform: esphome
    password: !secret bedroom_panel_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Bedroom Panel Fallback"

captive_portal:

http_request:
  verify_ssl: false
  timeout: 5s

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
    on_time_sync:
      - script.execute: update_clock

# ---------------------------------------------------------------- hardware
spi:
  - id: lcd_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO27
  # On-board RGB LED, common-anode (on = LOW), used as an accent glow.
  - platform: ledc
    id: led_red
    pin: GPIO22
    inverted: true
  - platform: ledc
    id: led_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
  - platform: rgb
    id: accent
    name: "Accent Light"
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 500ms
    effects:
      - pulse:
          name: "Breathe"
          transition_length: 2s
          update_interval: 2s
    on_state:
      - lvgl.widget.update:
          id: btn_accent
          state:
            checked: !lambda return id(accent).current_values.is_on();
      - lvgl.slider.update:
          id: sld_accent
          value: !lambda return id(accent).current_values.get_brightness() * 100.0;

display:
  - platform: ili9xxx
    id: lcd
    model: ST7796
    spi_id: lcd_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    data_rate: 40MHz
    # Landscape 480x320. If the picture is mirrored/upside down, flip
    # mirror_x / mirror_y; if colours look inverted, toggle invert_colors.
    dimensions:
      width: 480
      height: 320
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    invert_colors: false
    color_order: bgr
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: lcd_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    # Typical values for this panel; see README "Touch calibration".
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw_x=%d raw_y=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]
          level: INFO
      # Any touch wakes the screen. While LVGL is paused (screen off) the
      # touch is not passed to widgets, so waking never presses a button.
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on:
          id: backlight
          brightness: !lambda return id(screen_brightness) / 100.0;

globals:
  - id: pending_action
    type: int
    initial_value: "0"
  - id: screen_brightness
    type: int
    restore_value: true
    initial_value: "100"
  - id: cam_woke_screen
    type: bool
    initial_value: "false"
  - id: cam_selected
    type: int
    initial_value: "1"
  - id: cam_loaded
    type: bool
    initial_value: "false"
  # dark_mode true = true colours (dark navy theme); false = white look.
  - id: dark_mode
    type: bool
    restore_value: true
    initial_value: "true"
  - id: dark_auto
    type: bool
    restore_value: true
    initial_value: "true"

# ------------------------------------------------------- Home Assistant data
sensor:
  - platform: homeassistant
    id: t_bedroom
    entity_id: sensor.bedroom_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_t_bedroom
          # "--" when HA has no reading (otherwise "nan" shows as boxes)
          text: !lambda 'return std::isnan(x) ? std::string("--°") : str_sprintf("%.0f°", x);'
  - platform: homeassistant
    id: t_living
    entity_id: sensor.living_room_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_t_living
          # "--" when HA has no reading (otherwise "nan" shows as boxes)
          text: !lambda 'return std::isnan(x) ? std::string("--°") : str_sprintf("%.0f°", x);'
  - platform: homeassistant
    id: t_upstairs
    entity_id: sensor.upstairs_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_t_upstairs
          # "--" when HA has no reading (otherwise "nan" shows as boxes)
          text: !lambda 'return std::isnan(x) ? std::string("--°") : str_sprintf("%.0f°", x);'
  - platform: homeassistant
    id: t_outside
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_t_outside
          # "--" when HA has no reading (otherwise "nan" shows as boxes)
          text: !lambda 'return std::isnan(x) ? std::string("--°") : str_sprintf("%.0f°", x);'
  - platform: debug
    free:
      id: heap_free
      name: "Free Memory"
    block:
      id: heap_block
      name: "Largest Free Block"
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 60s
    on_value:
      - lvgl.label.update: { id: lbl_wifi, text: { format: "Wi-Fi: %.0f dBm", args: [x] } }

binary_sensor:
  - platform: homeassistant
    id: doorbell_ring
    entity_id: binary_sensor.front_doorbell_doorbell
    on_press:
      - script.execute: { id: show_cam, cam: 1, wait_new: true }
  - platform: homeassistant
    id: driveway_person
    entity_id: binary_sensor.driveway_person
    on_press:
      - script.execute: { id: show_cam, cam: 2, wait_new: true }

text_sensor:
  # When HA stored each camera picture. A change means a new picture is ready.
  - platform: homeassistant
    id: cam_time_door
    entity_id: input_text.panel_cam_door_time
    on_value: [ { script.execute: { id: cam_new_picture, cam: 1 } } ]
  - platform: homeassistant
    id: cam_time_drive
    entity_id: input_text.panel_cam_drive_time
    on_value: [ { script.execute: { id: cam_new_picture, cam: 2 } } ]
  # Dark Mode follows the sun when "Auto at night" is on. Fires only on a
  # change, so a manual tap holds until the next sunrise/sunset.
  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun
    on_value:
      - if:
          condition:
            lambda: return id(dark_auto);
          then:
            - globals.set: { id: dark_mode, value: !lambda 'return x == "below_horizon";' }
            - script.execute: apply_theme
  # Thermostat activity: heating / cooling / idle / off - colours the cards.
  - platform: homeassistant
    id: hv_bed
    entity_id: climate.bedroom
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: ico_bed
          text: !lambda |-
            if (x == "heating") return std::string("\U000F0238");
            if (x == "cooling") return std::string("\U000F0717");
            if (x == "fan") return std::string("\U000F0210");
            return std::string("");
      - script.execute: paint_colors
  - platform: homeassistant
    id: hv_liv
    entity_id: climate.living_room
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: ico_liv
          text: !lambda |-
            if (x == "heating") return std::string("\U000F0238");
            if (x == "cooling") return std::string("\U000F0717");
            if (x == "fan") return std::string("\U000F0210");
            return std::string("");
      - script.execute: paint_colors
  - platform: homeassistant
    id: hv_up
    entity_id: climate.upstairs
    attribute: hvac_action
    on_value:
      - lvgl.label.update:
          id: ico_up
          text: !lambda |-
            if (x == "heating") return std::string("\U000F0238");
            if (x == "cooling") return std::string("\U000F0717");
            if (x == "fan") return std::string("\U000F0210");
            return std::string("");
      - script.execute: paint_colors
  - platform: homeassistant
    id: weather_state
    entity_id: weather.forecast_home
    on_value:
      - lvgl.label.update:
          id: lbl_weather
          text: !lambda |-
            std::string s = x;
            for (auto &c : s) if (c == '-') c = ' ';
            if (!s.empty()) s[0] = toupper(s[0]);
            return s;
  - platform: wifi_info
    ip_address:
      id: ip_addr
      on_value:
        - lvgl.label.update: { id: lbl_ip, text: { format: "IP: %s", args: ["x.c_str()"] } }

  # Bedroom controls - button shows "checked" (lit) when the light is on.
  - platform: homeassistant
    id: st_lamps
    entity_id: light.bedroom_light
    on_value:
      - lvgl.widget.update: { id: btn_lamps, state: { checked: !lambda return x == "on"; } }
  - platform: homeassistant
    id: st_bedled
    entity_id: light.bed_led
    on_value:
      - lvgl.widget.update: { id: btn_bedled, state: { checked: !lambda return x == "on"; } }
  - platform: homeassistant
    id: st_fan
    entity_id: light.bedroom_fan
    on_value:
      - lvgl.widget.update: { id: btn_fan, state: { checked: !lambda return x == "on"; } }

  # Doors
  - platform: homeassistant
    id: st_gd1
    entity_id: cover.garage_door_1
    on_value: [ { script.execute: { id: paint_door, door: 1 } } ]
  - platform: homeassistant
    id: st_gd2
    entity_id: cover.garage_door_2
    on_value: [ { script.execute: { id: paint_door, door: 2 } } ]
  - platform: homeassistant
    id: st_gd3
    entity_id: cover.garage_door_3
    on_value: [ { script.execute: { id: paint_door, door: 3 } } ]
  - platform: homeassistant
    id: st_shop
    entity_id: cover.shop_door
    on_value: [ { script.execute: { id: paint_door, door: 4 } } ]
  - platform: homeassistant
    id: st_mower
    entity_id: cover.mower_door
    on_value: [ { script.execute: { id: paint_door, door: 5 } } ]
  - platform: homeassistant
    id: st_chicken
    entity_id: cover.chicken_coop_door
    on_value: [ { script.execute: { id: paint_door, door: 6 } } ]

  # Reset list online dots (from HA's view of each device)
  - platform: homeassistant
    id: av_bedled
    entity_id: light.bed_led
    on_value: [ { script.execute: paint_dots } ]
  - platform: homeassistant
    id: av_shopint
    entity_id: light.shoplightsint_tasmota
    on_value: [ { script.execute: paint_dots } ]
  - platform: homeassistant
    id: av_shopext
    entity_id: light.shoplightsext_tasmota
    on_value: [ { script.execute: paint_dots } ]
  - platform: homeassistant
    id: av_shopos
    entity_id: cover.shop_door
    on_value: [ { script.execute: paint_dots } ]
  - platform: homeassistant
    id: av_chicken
    entity_id: cover.chicken_coop_door
    on_value: [ { script.execute: paint_dots } ]
  - platform: homeassistant
    id: av_pool
    entity_id: light.pool_lights
    on_value: [ { script.execute: paint_dots } ]

debug:
  update_interval: 30s

# Camera pictures: HA keeps the latest door.jpg / drive.jpg (~5 KB, ~19k
# pixels so the decoded picture fits in RAM without PSRAM). LVGL scales it up
# to fill the left side of the pop-up.
online_image:
  - id: cam_img
    url: "http://192.168.1.115:8123/"
    format: JPEG
    type: RGB565
    # HA serves ~4 KB baseline JPEGs sized to ~19k pixels (~37 KB decoded)
    buffer_size: 16384
    update_interval: never
    on_download_finished:
      - logger.log: { level: WARN, tag: cam, format: "snapshot loaded OK" }
      - globals.set: { id: cam_loaded, value: "true" }
      - lvgl.image.update: { id: img_cam, src: cam_img }
      # fit inside the 330x320 box, keeping the picture's shape
      - lambda: |-
          lv_image_set_inner_align(id(img_cam), LV_IMAGE_ALIGN_CONTAIN);
          lv_image_set_antialias(id(img_cam), true);
      - lvgl.widget.show: img_cam
      - lvgl.widget.hide: lbl_cam_status
    on_error:
      # network hiccup or no picture stored yet - show_cam retries
      - lambda: |-
          ESP_LOGW("cam", "snapshot not ready / failed | free heap %u, largest block %u",
                   (unsigned) id(heap_free).state, (unsigned) id(heap_block).state);

# ------------------------------------------------------------------ scripts
script:
  - id: apply_theme
    then:
      # Colours are painted directly for day/night; the display itself always
      # runs in true colours (invert_colors(false) on this panel).
      - lambda: id(lcd).invert_colors(false);
      - script.execute: paint_colors
      - script.execute: paint_dots
      - script.execute: { id: paint_door, door: 1 }
      - script.execute: { id: paint_door, door: 2 }
      - script.execute: { id: paint_door, door: 3 }
      - script.execute: { id: paint_door, door: 4 }
      - script.execute: { id: paint_door, door: 5 }
      - script.execute: { id: paint_door, door: 6 }
      - lvgl.widget.update: { id: btn_dark, state: { checked: !lambda return id(dark_mode); } }
      - lvgl.widget.update: { id: btn_dark_auto, state: { checked: !lambda return id(dark_auto); } }

  # Day / night palette, painted directly onto the widgets.
  # Buttons: blue/black when off, light blue when on or pressed (both modes).
  # Thermostat cards: dark blue idle/off, light blue cooling, light orange heating.
  - id: paint_colors
    then:
      - lambda: |-
          const bool dark = id(dark_mode);
          auto C = [](uint32_t c) { return lv_color_hex(c); };
          const lv_color_t page   = C(dark ? 0x1C222B : 0xF3F5F8);
          const lv_color_t bar    = C(dark ? 0x141920 : 0xFFFFFF);
          const lv_color_t text   = C(dark ? 0xE6EDF3 : 0x1F2328);
          const lv_color_t tabtxt = C(dark ? 0xD0D7DE : 0x4A5560);
          const lv_color_t dimtxt = C(dark ? 0x9DA7B3 : 0x6E7781);
          const lv_color_t card   = C(dark ? 0x2A3240 : 0xE3E8EF);
          const lv_color_t off = C(0x2D66DD), on = C(0x8AB4F8), heat = C(0xFFB870), ink = C(0x0F1720);

          struct Swatch { lv_obj_t *btn; uint32_t col; };
          const Swatch swatches[] = { {id(btn_warm), 0xFFB347}, {id(btn_teal), 0x2DBFB0},
                                      {id(btn_blue), 0x2F81F7}, {id(btn_purple), 0xA371F7} };
          lv_obj_t *keep[] = { id(lbl_gd1), id(lbl_gd2), id(lbl_gd3), id(lbl_shop), id(lbl_mower), id(lbl_chicken) };
          auto is_keep = [&](lv_obj_t *o) { for (auto k : keep) if (k == o) return true; return false; };

          auto paint_button = [&](lv_obj_t *b) {
            uint32_t sw = 0;
            for (auto &w : swatches) if (w.btn == b) sw = w.col;
            const lv_color_t base = sw ? C(sw) : off;
            lv_obj_set_style_bg_color(b, base, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_color(b, sw ? base : on, LV_PART_MAIN | LV_STATE_CHECKED);
            lv_obj_set_style_bg_color(b, sw ? base : on, LV_PART_MAIN | LV_STATE_PRESSED);
            for (uint32_t i = 0; i < lv_obj_get_child_count(b); i++) {
              lv_obj_t *c = lv_obj_get_child(b, i);
              if (lv_obj_check_type(c, &lv_label_class) && !is_keep(c)) lv_obj_set_style_text_color(c, ink, 0);
            }
          };
          auto paint_card = [&](lv_obj_t *cd, lv_color_t bg, lv_color_t fg) {
            lv_obj_set_style_bg_color(cd, bg, 0);
            lv_obj_set_style_bg_opa(cd, LV_OPA_COVER, 0);
            for (uint32_t i = 0; i < lv_obj_get_child_count(cd); i++) {
              lv_obj_t *c = lv_obj_get_child(cd, i);
              if (lv_obj_check_type(c, &lv_label_class) && !is_keep(c)) lv_obj_set_style_text_color(c, fg, 0);
            }
          };

          // Page background and tab bar
          lv_obj_t *scr = lv_screen_active();
          lv_obj_set_style_bg_color(scr, page, 0);
          lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, 0);
          lv_obj_t *tv = id(tabs);
          lv_obj_set_style_bg_color(tv, page, 0);
          lv_obj_set_style_bg_opa(tv, LV_OPA_COVER, 0);
          lv_obj_t *content = lv_tabview_get_content(tv);
          lv_obj_set_style_bg_opa(content, LV_OPA_TRANSP, 0);
          for (uint32_t i = 0; i < lv_obj_get_child_count(content); i++) {
            lv_obj_t *pg = lv_obj_get_child(content, i);
            lv_obj_set_style_bg_opa(pg, LV_OPA_TRANSP, 0);
            // the page itself never scrolls/wobbles; swiping between tabs still works
            lv_obj_remove_flag(pg, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_set_scrollbar_mode(pg, LV_SCROLLBAR_MODE_OFF);
          }
          lv_obj_t *tb = lv_tabview_get_tab_bar(tv);
          lv_obj_set_style_bg_color(tb, bar, 0);
          lv_obj_set_style_bg_opa(tb, LV_OPA_COVER, 0);
          for (uint32_t i = 0; i < lv_obj_get_child_count(tb); i++) {
            lv_obj_t *t = lv_obj_get_child(tb, i);
            for (lv_state_t st : {LV_STATE_DEFAULT, LV_STATE_CHECKED, LV_STATE_PRESSED})
              lv_obj_set_style_bg_opa(t, LV_OPA_TRANSP, LV_PART_MAIN | st);
            lv_obj_set_style_text_color(t, tabtxt, LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_color(t, off, LV_PART_MAIN | LV_STATE_CHECKED);
            for (uint32_t j = 0; j < lv_obj_get_child_count(t); j++) {
              lv_obj_t *l = lv_obj_get_child(t, j);
              if (lv_obj_check_type(l, &lv_label_class)) lv_obj_set_style_text_color(l, tabtxt, 0);
            }
          }

          // Everything on the pages
          std::function<void(lv_obj_t *)> walk = [&](lv_obj_t *o) {
            for (uint32_t i = 0; i < lv_obj_get_child_count(o); i++) {
              lv_obj_t *c = lv_obj_get_child(o, i);
              if (lv_obj_check_type(c, &lv_button_class)) {
                paint_button(c);
              } else if (lv_obj_check_type(c, &lv_label_class)) {
                if (is_keep(c)) continue;
                if (c == id(lbl_clock)) lv_obj_set_style_text_color(c, tabtxt, 0);
                else if (c == id(lbl_date) || c == id(lbl_wifi) || c == id(lbl_ip)) lv_obj_set_style_text_color(c, dimtxt, 0);
                else lv_obj_set_style_text_color(c, text, 0);
              } else {
                // plain containers (e.g. the Reset tab grid) show the page colour;
                // cards get their own colour further down
                lv_obj_set_style_bg_opa(c, LV_OPA_TRANSP, 0);
                lv_obj_set_style_border_width(c, 0, 0);
                walk(c);
              }
            }
          };
          walk(content);

          // Cards
          // Outside weather has no on/off state, so it stays a neutral card; the door
          // status tiles are coloured by paint_door.
          paint_card(id(card_out), card, text);
          auto hv = [&](const std::string &a) { return a == "heating" ? heat : (a == "cooling" ? on : off); };
          paint_card(id(card_bed), hv(id(hv_bed).state), ink);
          paint_card(id(card_liv), hv(id(hv_liv).state), ink);
          paint_card(id(card_up),  hv(id(hv_up).state),  ink);

          // Pop-up buttons (confirm dialog)
          std::function<void(lv_obj_t *)> walk_top = [&](lv_obj_t *o) {
            for (uint32_t i = 0; i < lv_obj_get_child_count(o); i++) {
              lv_obj_t *c = lv_obj_get_child(o, i);
              if (lv_obj_check_type(c, &lv_button_class)) paint_button(c); else walk_top(c);
            }
          };
          walk_top(lv_layer_top());

          // door buttons/tiles carry state colours - repaint them after the sweep
          for (int d = 1; d <= 6; d++) id(paint_door).execute(d);

  # Reset tab dots: green = online, red = offline (as Home Assistant sees it).
  - id: paint_dots
    mode: queued
    then:
      - lambda: |-
          struct Dot { lv_obj_t *dot; std::string state; };
          const Dot dots[] = { {id(dot_bedled), id(av_bedled).state}, {id(dot_shopint), id(av_shopint).state},
                               {id(dot_shopext), id(av_shopext).state}, {id(dot_shopos), id(av_shopos).state},
                               {id(dot_chicken), id(av_chicken).state}, {id(dot_pool), id(av_pool).state} };
          for (auto &d : dots) {
            uint32_t c = d.state.empty() ? 0x8B949E : (d.state == "unavailable" ? 0xE5534B : 0x3FB950);
            lv_obj_set_style_bg_color(d.dot, lv_color_hex(c), LV_PART_MAIN);
          }

  # Show camera 1 (Front Door) or 2 (Driveway); wakes the screen if needed.
  # Cams buttons (wait_new false) show HA's stored picture straight away.
  # Doorbell / driveway person (wait_new true) wait up to 15 s for HA to store
  # a fresh picture (cam_new_picture fetches it), then fall back to the
  # stored one.
  - id: show_cam
    mode: restart
    parameters:
      cam: int
      wait_new: bool
    then:
      - globals.set: { id: cam_selected, value: !lambda return cam; }
      - if:
          condition: lvgl.is_paused
          then:
            - globals.set: { id: cam_woke_screen, value: "true" }
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on:
          id: backlight
          brightness: !lambda return id(screen_brightness) / 100.0;
      - lvgl.label.update:
          id: lbl_cam_title
          text: !lambda 'return id(cam_selected) == 1 ? std::string("Front Door") : std::string("Driveway");'
      - script.execute: update_cam_time
      - lvgl.label.update:
          id: lbl_cam_status
          text: !lambda 'return wait_new ? std::string("Getting picture...") : std::string("Loading...");'
      - lvgl.widget.show: lbl_cam_status
      - lvgl.widget.hide: img_cam
      - lvgl.widget.hide: wake_shield
      - lvgl.widget.show: dlg_cam
      - globals.set: { id: cam_loaded, value: "false" }
      - if:
          condition:
            lambda: return wait_new;
          then:
            - wait_until:
                condition:
                  lambda: return id(cam_loaded);
                timeout: 15s
      - repeat:
          count: 3
          then:
            - if:
                condition:
                  lambda: return !id(cam_loaded);
                then:
                  - script.execute: fetch_cam
                  - wait_until:
                      condition:
                        lambda: return id(cam_loaded);
                      timeout: 4s
      - if:
          condition:
            lambda: return !id(cam_loaded);
          then:
            - lvgl.label.update: { id: lbl_cam_status, text: "No picture yet" }
      - delay: 30s
      - script.execute: close_cam

  # HA stored a new picture: if that camera's pop-up is open, show it.
  - id: cam_new_picture
    parameters:
      cam: int
    then:
      - if:
          condition:
            lambda: |-
              return id(cam_selected) == cam &&
                     !lv_obj_has_flag(id(dlg_cam), LV_OBJ_FLAG_HIDDEN);
          then:
            - script.execute: update_cam_time
            - script.execute: fetch_cam

  # "Oct 14, 12:57:59 PM" from HA -> "Oct 14" / "12:57 PM"
  - id: update_cam_time
    then:
      - lvgl.label.update:
          id: lbl_cam_time
          text: !lambda |-
            std::string t = id(cam_selected) == 1 ? id(cam_time_door).state
                                                  : id(cam_time_drive).state;
            if (t.empty() || t == "unknown" || t == "unavailable") return std::string("");
            size_t c = t.rfind(':');
            if (c != std::string::npos && c + 3 <= t.size()) t.erase(c, 3);
            size_t k = t.find(", ");
            if (k != std::string::npos) t.replace(k, 2, "\n");
            return t;

  - id: fetch_cam
    then:
      - lambda: |-
          ESP_LOGW("cam", "fetching %s.jpg | free heap %u, largest block %u",
                   id(cam_selected) == 1 ? "door" : "drive",
                   (unsigned) id(heap_free).state, (unsigned) id(heap_block).state);
      - online_image.set_url:
          id: cam_img
          url: !lambda |-
            return std::string("http://192.168.1.115:8123${cam_path}/") +
                   (id(cam_selected) == 1 ? "door.jpg" : "drive.jpg");
      - component.update: cam_img

  - id: close_cam
    then:
      - script.stop: show_cam
      - lvgl.widget.hide: dlg_cam
      - script.execute: apply_theme
      - if:
          condition:
            lambda: return id(cam_woke_screen);
          then:
            - globals.set: { id: cam_woke_screen, value: "false" }
            - light.turn_off: backlight
            - lvgl.pause:

  - id: update_clock
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            int h = t.hour % 12; if (h == 0) h = 12;
            char b[8]; snprintf(b, sizeof(b), "%d:%02d", h, t.minute);
            return std::string(b);
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("");
            return t.strftime("%a %b %d");

  - id: paint_door
    mode: queued
    max_runs: 12
    parameters:
      door: int
    then:
      - lambda: |-
          // Same scheme as the bedroom buttons: dark blue = closed, light blue = open/moving.
          std::string s; lv_obj_t *lbl = nullptr; lv_obj_t *box = nullptr; bool is_btn = false;
          switch (door) {
            case 1: s = id(st_gd1).state; lbl = id(lbl_gd1); is_btn = true; break;
            case 2: s = id(st_gd2).state; lbl = id(lbl_gd2); is_btn = true; break;
            case 3: s = id(st_gd3).state; lbl = id(lbl_gd3); is_btn = true; break;
            case 4: s = id(st_shop).state; lbl = id(lbl_shop); box = id(card_shop); break;
            case 5: s = id(st_mower).state; lbl = id(lbl_mower); box = id(card_mower); break;
            case 6: s = id(st_chicken).state; lbl = id(lbl_chicken); box = id(card_chick); break;
          }
          if (!lbl) return;
          if (is_btn) box = lv_obj_get_parent(lbl);
          std::string t = s.empty() ? std::string("--") : s;
          t[0] = toupper(t[0]);
          lv_label_set_text(lbl, t.c_str());
          const bool open = (s == "open" || s == "opening" || s == "closing" || s == "stopped");
          const lv_color_t ink = lv_color_hex(0x0F1720);
          if (is_btn) {
            lv_obj_set_state(box, LV_STATE_CHECKED, open);
            lv_obj_set_style_text_color(lbl, ink, 0);
          } else {
            lv_obj_set_style_bg_color(box, lv_color_hex(open ? 0x8AB4F8 : 0x2D66DD), 0);
            lv_obj_set_style_bg_opa(box, LV_OPA_COVER, 0);
            for (uint32_t i = 0; i < lv_obj_get_child_count(box); i++) {
              lv_obj_t *c = lv_obj_get_child(box, i);
              if (lv_obj_check_type(c, &lv_label_class)) lv_obj_set_style_text_color(c, ink, 0);
            }
          }

  # Opens the confirm dialog for action N with the given question.
  - id: ask
    parameters:
      action: int
      question: string
    then:
      - globals.set: { id: pending_action, value: !lambda return action; }
      - lvgl.label.update: { id: lbl_confirm, text: !lambda return question; }
      - lvgl.widget.show: dlg_confirm

  - id: run_pending
    then:
      - lambda: |-
          switch (id(pending_action)) {
            case 1: id(rst_bedled).execute(); break;
            case 2: id(rst_shopint).execute(); break;
            case 3: id(rst_shopext).execute(); break;
            case 4: id(rst_shopos).execute(); break;
            case 5: id(rst_chicken).execute(); break;
            case 6: id(rst_pool).execute(); break;
            case 11: id(tog_gd1).execute(); break;
            case 12: id(tog_gd2).execute(); break;
            case 13: id(tog_gd3).execute(); break;
            case 21: id(scene_all_off).execute(); break;
          }
          id(pending_action) = 0;

  # Direct-to-device restarts (no HA/MQTT needed)
  - id: rst_bedled
    then: [ { http_request.get: { url: "http://192.168.1.54/cm?cmnd=Restart%201" } } ]
  - id: rst_shopint
    then: [ { http_request.get: { url: "http://192.168.1.38/cm?cmnd=Restart%201" } } ]
  - id: rst_shopext
    then: [ { http_request.get: { url: "http://192.168.1.37/cm?cmnd=Restart%201" } } ]
  - id: rst_shopos
    then: [ { http_request.get: { url: "http://192.168.1.39/cm?cmnd=Restart%201" } } ]
  - id: rst_chicken
    then: [ { http_request.get: { url: "http://192.168.1.46/cm?cmnd=Restart%201" } } ]
  - id: rst_pool
    then: [ { http_request.get: { url: "http://192.168.1.45/cm?cmnd=Restart%201" } } ]

  - id: tog_gd1
    then: [ { homeassistant.action: { action: cover.toggle, data: { entity_id: cover.garage_door_1 } } } ]
  - id: tog_gd2
    then: [ { homeassistant.action: { action: cover.toggle, data: { entity_id: cover.garage_door_2 } } } ]
  - id: scene_all_off
    then: [ { homeassistant.action: { action: script.turn_on, data: { entity_id: script.panel_all_off } } } ]

  - id: tog_gd3
    then: [ { homeassistant.action: { action: cover.toggle, data: { entity_id: cover.garage_door_3 } } } ]

# --------------------------------------------------------------------- UI
font:
  # Bold + anti-aliased (bpp 4) so the clock stays crisp on the white look too.
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: f_clock
    size: 64
    bpp: 4
    glyphs: "0123456789:- "
  - file: "gfonts://Roboto"
    id: f_temp
    size: 30
    glyphs: "0123456789-°. "

  # Material Design Icons: flame (heat), snowflake (cool), fan
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: f_icons
    size: 22
    bpp: 4
    glyphs: ["\U000F0238", "\U000F0717", "\U000F0210"]

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 12%          # no PSRAM - small draw buffer leaves RAM for camera snapshots
  default_font: montserrat_16
  theme:
    obj:
      bg_color: 0x0F1720
      text_color: 0xE6EDF3
      border_width: 0
    button:
      bg_color: 0x1F2A36
      radius: 14
      text_color: 0xE6EDF3
      checked:
        bg_color: 0xD29922
        text_color: 0x0F1720
      pressed:
        bg_color: 0x2F81F7
    label:
      text_color: 0xE6EDF3
  style_definitions:
    - id: card
      bg_color: 0x161E27
      radius: 14
      pad_all: 8
    - id: dim
      text_color: 0x8B949E
  on_idle:
    - timeout: 60s
      then:
        - light.turn_on: { id: backlight, brightness: 15% }
        # From here the first tap only wakes the screen (see wake_shield).
        - lvgl.widget.show: wake_shield
    - timeout: 300s
      then:
        - light.turn_off: backlight
        - lvgl.pause:

  top_layer:
    widgets:
      - obj:
          id: dlg_cam
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: COVER
          pad_all: 0
          border_width: 0
          radius: 0
          scrollable: false
          on_click:
            - globals.set: { id: cam_woke_screen, value: "false" }
            - script.execute: close_cam
          widgets:
            # left 330x320: the picture, scaled to fit (see on_download_finished)
            - image: { id: img_cam, x: 0, y: 0, width: 330, height: 320, hidden: true, src: cam_img }
            - label:
                id: lbl_cam_status
                x: 0
                y: 150
                width: 330
                text_align: CENTER
                text_color: 0x9DA7B3
                text_font: montserrat_20
                text: "Loading..."
            # right 150 px: name, when the picture was taken, tap to close
            - label:
                id: lbl_cam_title
                x: 335
                y: 70
                width: 140
                text_align: CENTER
                long_mode: WRAP
                text_color: 0xE6EDF3
                text_font: montserrat_26
                text: "Front Door"
            - label:
                id: lbl_cam_time
                x: 335
                y: 150
                width: 140
                text_align: CENTER
                long_mode: WRAP
                text_color: 0xE6EDF3
                text_font: montserrat_20
                text: ""
            - label:
                x: 335
                y: 280
                width: 140
                text_align: CENTER
                text_color: 0x9DA7B3
                text: "Tap to close"
      - label:
          id: badge_no_ha
          align: TOP_RIGHT
          x: -6
          y: 4
          text: "No HA"
          text_color: 0xFFFFFF
          bg_color: 0xE5534B
          bg_opa: COVER
          radius: 6
          pad_all: 4
      - obj:
          id: dlg_confirm
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 70%
          widgets:
            - obj:
                align: CENTER
                width: 380
                height: 190
                bg_color: 0x1F2A36
                radius: 16
                widgets:
                  - label:
                      id: lbl_confirm
                      align: TOP_MID
                      y: 18
                      text_font: montserrat_22
                      text: "Are you sure?"
                  - button:
                      align: BOTTOM_LEFT
                      x: 20
                      y: -16
                      width: 150
                      height: 60
                      bg_color: 0xD29922
                      widgets: [ { label: { align: CENTER, text: "Yes", text_color: 0x0F1720, text_font: montserrat_22 } } ]
                      on_click:
                        - lvgl.widget.hide: dlg_confirm
                        - script.execute: run_pending
                  - button:
                      align: BOTTOM_RIGHT
                      x: -20
                      y: -16
                      width: 150
                      height: 60
                      widgets: [ { label: { align: CENTER, text: "Cancel", text_font: montserrat_22 } } ]
                      on_click:
                        - lvgl.widget.hide: dlg_confirm
                        - globals.set: { id: pending_action, value: "0" }
      # Invisible full-screen cover, shown once the screen dims. It catches
      # the first tap so waking never presses whatever is underneath.
      - obj:
          id: wake_shield
          hidden: true
          width: 100%
          height: 100%
          bg_opa: TRANSP
          on_press:
            - lvgl.widget.hide: wake_shield
            - light.turn_on:
                id: backlight
                brightness: !lambda return id(screen_brightness) / 100.0;

  pages:
    - id: main_page
      widgets:
        - tabview:
            id: tabs
            width: 100%
            height: 100%
            position: BOTTOM
            size: 46
            tabs:
              # ----------------------------------------------------- HOME
              - name: "Home"
                id: tab_home
                widgets:
                  - label: { id: lbl_clock, x: 6, y: 0, text_font: f_clock, text: "--:--" }
                  - label: { id: lbl_date, x: 10, y: 72, styles: dim, text_font: montserrat_18, text: "" }
                  - obj:
                      id: card_out
                      styles: card
                      x: 270
                      y: 4
                      width: 180
                      height: 92
                      widgets:
                        - label: { id: lbl_t_outside, align: TOP_LEFT, text_font: f_temp, text: "--°" }
                        - label: { id: lbl_weather, align: BOTTOM_LEFT, styles: dim, text: "" }
                        - label: { align: TOP_RIGHT, styles: dim, text: "Outside" }
                  - obj:
                      id: card_bed
                      styles: card
                      x: 0
                      y: 104
                      width: 146
                      height: 64
                      widgets:
                        - label: { align: TOP_LEFT, styles: dim, text_font: montserrat_14, text: "Bedroom" }
                        - label: { id: ico_bed, align: TOP_RIGHT, text_font: f_icons, text: "" }
                        - label: { id: lbl_t_bedroom, align: BOTTOM_RIGHT, text_font: f_temp, text: "--°" }
                  - obj:
                      id: card_liv
                      styles: card
                      x: 152
                      y: 104
                      width: 146
                      height: 64
                      widgets:
                        - label: { align: TOP_LEFT, styles: dim, text_font: montserrat_14, text: "Living" }
                        - label: { id: ico_liv, align: TOP_RIGHT, text_font: f_icons, text: "" }
                        - label: { id: lbl_t_living, align: BOTTOM_RIGHT, text_font: f_temp, text: "--°" }
                  - obj:
                      id: card_up
                      styles: card
                      x: 304
                      y: 104
                      width: 146
                      height: 64
                      widgets:
                        - label: { align: TOP_LEFT, styles: dim, text_font: montserrat_14, text: "Upstairs" }
                        - label: { id: ico_up, align: TOP_RIGHT, text_font: f_icons, text: "" }
                        - label: { id: lbl_t_upstairs, align: BOTTOM_RIGHT, text_font: f_temp, text: "--°" }
                  - button:
                      id: btn_lamps
                      x: 0
                      y: 178
                      width: 146
                      height: 74
                      widgets: [ { label: { align: CENTER, text: "Lamps", text_font: montserrat_20 } } ]
                      on_click:
                        - homeassistant.action: { action: light.toggle, data: { entity_id: light.bedroom_light } }
                  - button:
                      id: btn_bedled
                      x: 152
                      y: 178
                      width: 146
                      height: 74
                      widgets: [ { label: { align: CENTER, text: "Bed LED", text_font: montserrat_20 } } ]
                      on_click:
                        - homeassistant.action: { action: light.toggle, data: { entity_id: light.bed_led } }
                  - button:
                      id: btn_fan
                      x: 304
                      y: 178
                      width: 146
                      height: 74
                      widgets: [ { label: { align: CENTER, text: "Fan Light", text_font: montserrat_20 } } ]
                      on_click:
                        - homeassistant.action: { action: light.toggle, data: { entity_id: light.bedroom_fan } }

              # --------------------------------------------------- SCENES
              - name: "Scenes"
                widgets:
                  - button:
                      x: 0
                      y: 6
                      width: 450
                      height: 76
                      widgets: [ { label: { align: CENTER, text: "Good Night", text_font: montserrat_26 } } ]
                      on_click:
                        - homeassistant.action: { action: script.turn_on, data: { entity_id: script.panel_good_night } }
                  - button:
                      x: 0
                      y: 90
                      width: 450
                      height: 76
                      widgets: [ { label: { align: CENTER, text: "Movie", text_font: montserrat_26 } } ]
                      on_click:
                        - homeassistant.action: { action: script.turn_on, data: { entity_id: script.panel_movie } }
                  - button:
                      x: 0
                      y: 174
                      width: 450
                      height: 76
                      widgets: [ { label: { align: CENTER, text: "All Off", text_font: montserrat_26 } } ]
                      on_click: [ { script.execute: { id: ask, action: 21, question: "Turn everything off?" } } ]

              # ---------------------------------------------------- DOORS
              - name: "Doors"
                widgets:
                  - button:
                      x: 0
                      y: 4
                      width: 146
                      height: 120
                      widgets:
                        - label: { align: TOP_MID, y: 6, text: "Garage 1", text_font: montserrat_18 }
                        - label: { id: lbl_gd1, align: BOTTOM_MID, y: -8, text: "--", text_font: montserrat_22 }
                      on_click:
                        - script.execute:
                            id: ask
                            action: 11
                            question: !lambda 'return id(st_gd1).state == "closed" ? std::string("Open Garage Door 1?") : std::string("Close Garage Door 1?");'
                  - button:
                      x: 152
                      y: 4
                      width: 146
                      height: 120
                      widgets:
                        - label: { align: TOP_MID, y: 6, text: "Garage 2", text_font: montserrat_18 }
                        - label: { id: lbl_gd2, align: BOTTOM_MID, y: -8, text: "--", text_font: montserrat_22 }
                      on_click:
                        - script.execute:
                            id: ask
                            action: 12
                            question: !lambda 'return id(st_gd2).state == "closed" ? std::string("Open Garage Door 2?") : std::string("Close Garage Door 2?");'
                  - button:
                      x: 304
                      y: 4
                      width: 146
                      height: 120
                      widgets:
                        - label: { align: TOP_MID, y: 6, text: "Garage 3", text_font: montserrat_18 }
                        - label: { id: lbl_gd3, align: BOTTOM_MID, y: -8, text: "--", text_font: montserrat_22 }
                      on_click:
                        - script.execute:
                            id: ask
                            action: 13
                            question: !lambda 'return id(st_gd3).state == "closed" ? std::string("Open Garage Door 3?") : std::string("Close Garage Door 3?");'
                  # status only
                  - obj:
                      id: card_shop
                      styles: card
                      x: 0
                      y: 134
                      width: 146
                      height: 110
                      widgets:
                        - label: { align: TOP_MID, styles: dim, text: "Shop Door" }
                        - label: { id: lbl_shop, align: BOTTOM_MID, text: "--", text_font: montserrat_22 }
                  - obj:
                      id: card_mower
                      styles: card
                      x: 152
                      y: 134
                      width: 146
                      height: 110
                      widgets:
                        - label: { align: TOP_MID, styles: dim, text: "Mower Door" }
                        - label: { id: lbl_mower, align: BOTTOM_MID, text: "--", text_font: montserrat_22 }
                  - obj:
                      id: card_chick
                      styles: card
                      x: 304
                      y: 134
                      width: 146
                      height: 110
                      widgets:
                        - label: { align: TOP_MID, styles: dim, text: "Chicken Door" }
                        - label: { id: lbl_chicken, align: BOTTOM_MID, text: "--", text_font: montserrat_22 }

              # ----------------------------------------------------- CAMS
              - name: "Cams"
                widgets:
                  - button:
                      x: 0
                      y: 6
                      width: 450
                      height: 110
                      widgets: [ { label: { align: CENTER, text: "Front Door", text_font: montserrat_26 } } ]
                      on_click: [ { script.execute: { id: show_cam, cam: 1, wait_new: false } } ]
                  - button:
                      x: 0
                      y: 128
                      width: 450
                      height: 110
                      widgets: [ { label: { align: CENTER, text: "Driveway", text_font: montserrat_26 } } ]
                      on_click: [ { script.execute: { id: show_cam, cam: 2, wait_new: false } } ]

              # ---------------------------------------------------- RESET
              - name: "Reset"
                widgets:
                  - button:
                      x: 0
                      y: 2
                      width: 221
                      height: 78
                      widgets:
                        - obj: { id: dot_bedled, align: LEFT_MID, width: 14, height: 14, radius: 7, bg_color: 0x8B949E }
                        - label: { align: LEFT_MID, x: 24, text: "BedLED", text_font: montserrat_20 }
                      on_click: [ { script.execute: { id: ask, action: 1, question: "Restart BedLED?" } } ]
                  - button:
                      x: 229
                      y: 2
                      width: 221
                      height: 78
                      widgets:
                        - obj: { id: dot_shopint, align: LEFT_MID, width: 14, height: 14, radius: 7, bg_color: 0x8B949E }
                        - label: { align: LEFT_MID, x: 24, text: "Shop Lights Int", text_font: montserrat_20 }
                      on_click: [ { script.execute: { id: ask, action: 2, question: "Restart Shop Lights Int?" } } ]
                  - button:
                      x: 0
                      y: 88
                      width: 221
                      height: 78
                      widgets:
                        - obj: { id: dot_shopext, align: LEFT_MID, width: 14, height: 14, radius: 7, bg_color: 0x8B949E }
                        - label: { align: LEFT_MID, x: 24, text: "Shop Lights Ext", text_font: montserrat_20 }
                      on_click: [ { script.execute: { id: ask, action: 3, question: "Restart Shop Lights Ext?" } } ]
                  - button:
                      x: 229
                      y: 88
                      width: 221
                      height: 78
                      widgets:
                        - obj: { id: dot_shopos, align: LEFT_MID, width: 14, height: 14, radius: 7, bg_color: 0x8B949E }
                        - label: { align: LEFT_MID, x: 24, text: "ShopOS", text_font: montserrat_20 }
