              # ---------------------------------------------------- SETUP
              - name: "Setup"
                widgets:
                  - label: { x: 0, y: 0, text: "Display", text_font: montserrat_18 }
                  - slider:
                      id: sld_brightness
                      x: 10
                      y: 30
                      width: 430
                      height: 22
                      min_value: 10
                      max_value: 100
                      value: 100
                      on_release:
                        - globals.set: { id: screen_brightness, value: !lambda return int(x); }
                        - light.turn_on: { id: backlight, brightness: !lambda return x / 100.0; }
                  - button:
                      id: btn_dark
                      x: 0
                      y: 62
                      width: 150
                      height: 38
                      widgets: [ { label: { align: CENTER, text: "Dark Mode" } } ]
                      on_click:
                        - globals.set: { id: dark_mode, value: !lambda return !id(dark_mode); }
                        - script.execute: apply_theme
                  - button:
                      id: btn_dark_auto
                      x: 160
                      y: 62
                      width: 150
                      height: 38
                      widgets: [ { label: { align: CENTER, text: "Auto at night" } } ]
                      on_click:
                        - globals.set: { id: dark_auto, value: !lambda return !id(dark_auto); }
                        - if:
                            condition:
                              lambda: return id(dark_auto);
                            then:
                              - globals.set: { id: dark_mode, value: !lambda 'return id(sun_state).state == "below_horizon";' }
                        - script.execute: apply_theme
                  - label: { x: 0, y: 116, text: "Accent light", text_font: montserrat_18 }
                  - button:
                      id: btn_accent
                      x: 310
                      y: 108
                      width: 140
                      height: 38
