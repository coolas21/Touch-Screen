# Scenes for the bedroom ESPHome touch panel (esphome/bedroom-panel.yaml).
# Never turned off by these scenes: bedroom fan, fridge light, Bathroom LED
# (light.bathroom_led_tasmota), front door and back porch lights, and the
# kitchen WLED strip (handled separately).
script:
  panel_all_off:
    alias: "All Off"
    icon: mdi:power
    mode: single
    sequence:
      - service: light.turn_off
        target:
          entity_id: &off_lights
            - light.bathdimmer_tasmota
            - light.bathswitch_tasmota
            - light.bed_led
            - light.bedroom_light
            - light.lukelamp_tasmota
            - light.rhodalamp_tasmota
            - light.fan_light
            - light.diningroom_switch_tasmota
            - light.kitchen_dimmer_tasmota
            - light.sw_kitchen_tasmota
            - light.livingroom_dimmer_tasmota
            - light.livingroom_dimmer_2_tasmota
            - light.driveway_sw_tasmota
            - light.back_yard_sw_tasmota
            - light.garage_inside_tasmota
            - light.shoplightsint_tasmota
            - light.shoplightsext_tasmota
            - light.pool_lights
            - light.pool_led
      - service: switch.turn_off
        target:
          entity_id: &off_light_switches
            - switch.kitchen_acc_tasmota
            - switch.dinning_acc_tasmota

  panel_good_night:
    alias: "Good Night"
    icon: mdi:weather-night
    mode: single
    sequence:
      - service: cover.close_cover
        target:
          entity_id:
            - cover.garage_door_1
            - cover.garage_door_2
            - cover.garage_door_3
      - service: light.turn_off
        target:
          entity_id: *off_lights
      - service: switch.turn_off
        target:
          entity_id: *off_light_switches
      # Kitchen WLED to the red nightlight (same as the 10:30pm automation in
      # evening_schedule.yaml); Bathroom LED is left as it is.
      - service: light.turn_on
        target:
          entity_id: light.kitchen_kitchen_leds
        data:
          rgb_color: [255, 0, 0]
          brightness: 100
      - service: switch.turn_on
        target:
          entity_id: switch.kitchen_kitchen_leds_nightlight

  panel_movie:
    alias: "Movie"
    icon: mdi:movie-open
    mode: restart
    sequence:
      # Dining room goes off at the same moment the living room starts its
      # fade; kitchen and foyer are left alone.
      - parallel:
          - sequence:
              - service: light.turn_off
                target:
                  entity_id: light.diningroom_switch_tasmota
              - service: switch.turn_off
                target:
                  entity_id: switch.dinning_acc_tasmota
          # Only Dimmer 1: Dimmer 2 is in the same device group ("livin") and
          # follows it, so fading both would make them fight each other.
          - service: script.panel_fade_off
            data:
              entity: light.livingroom_dimmer_tasmota

  # Fades a dimmer from its current brightness down to 1% over 1.5 s
  # (6 steps x 250 ms), then turns it off. Does nothing if it's already off.
  panel_fade_off:
    alias: "Panel - fade a dimmer off"
    mode: parallel
    fields:
      entity:
        description: Light to fade off
        example: light.livingroom_dimmer_tasmota
    sequence:
      - condition: template
        value_template: "{{ is_state(entity, 'on') }}"
      - variables:
          steps: 6
          start: "{{ ((state_attr(entity, 'brightness') or 255) / 255 * 100) | round(0) | int }}"
      - repeat:
          count: "{{ steps }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ entity }}"
              data:
                brightness_pct: "{{ [ (start - (start - 1) * repeat.index / steps) | round(0) | int, 1 ] | max }}"
            - delay:
                milliseconds: 250
      - service: light.turn_off
        target:
          entity_id: "{{ entity }}"
