# Scenes for the bedroom ESPHome touch panel (esphome/bedroom-panel.yaml).
# Never turned off by these scenes: bedroom fan, fridge light, Bathroom LED
# (light.bathroom_led_tasmota), front door and back porch lights, and the
# kitchen WLED strip (handled separately).
# Camera snapshots for the panel. Eufy's saved event thumbnails can't be
# decoded outside the Eufy app, and its photos are 100-300 KB - far too big
# for the panel's RAM. So whenever a camera sees something, HA grabs a live
# frame through the Eufy add-on, shrinks it to ~5 KB and keeps it as
# door.jpg / drive.jpg. The panel just downloads the stored picture when
# tapped (instant), and the time it was taken is shown next to it. Random
# folder name so the file can't be guessed.
shell_command:
  panel_clear_snapshot: >-
    rm -f /config/www/panel_CHANGE_ME_RANDOM/{{ name }}.jpg
  panel_shrink_snapshot: >-
    python3 /config/panel_snapshot.py /config/www/panel_CHANGE_ME_RANDOM {{ name }}

input_text:
  panel_cam_door_time:
    name: Panel Front Door picture time
    max: 40
  panel_cam_drive_time:
    name: Panel Driveway picture time
    max: 40

automation:
  - alias: "Panel - update stored camera picture"
    id: panel_prepare_cam_snapshot
    mode: parallel
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.front_doorbell_doorbell
          - binary_sensor.front_doorbell_person
        to: "on"
        id: door
      - platform: state
        entity_id:
          - binary_sensor.driveway_person
          - binary_sensor.driveway_vehicle
        to: "on"
        id: drive
    action:
      - service: script.panel_cam_snapshot
        data:
          camera: "{{ 'camera.front_doorbell' if trigger.id == 'door' else 'camera.driveway' }}"
          name: "{{ trigger.id }}"

script:
  panel_cam_snapshot:
    alias: "Panel - camera snapshot"
    mode: queued
    max: 4
    fields:
      camera:
        example: camera.front_doorbell
      name:
        example: door
    sequence:
      # Retry if the add-on handed back the undecodable event thumbnail. The
      # previous picture stays in place until a new one is ready.
      - repeat:
          sequence:
            - service: eufy_event_gateway.capture_snapshot
              target:
                entity_id: "{{ camera }}"
              data:
                filename: "/config/www/panel_CHANGE_ME_RANDOM/{{ name }}_full.jpg"
            - service: shell_command.panel_shrink_snapshot
              data:
                name: "{{ name }}"
              response_variable: shrink
            - if:
                - condition: template
                  value_template: "{{ shrink.returncode != 0 }}"
              then:
                - delay: { milliseconds: 800 }
          until:
            - condition: template
              value_template: "{{ shrink.returncode == 0 or repeat.index >= 3 }}"
      # The panel watches this; a change means a new picture is ready.
      - if:
          - condition: template
            value_template: "{{ shrink.returncode == 0 }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: "input_text.panel_cam_{{ name }}_time"
            data:
              value: "{{ now().strftime('%b %-d, %-I:%M:%S %p') }}"

  panel_all_off:
    alias: "All Off"
    icon: mdi:power
    mode: single
    sequence:
      - service: light.turn_off
        target:
          entity_id: &off_lights
            - light.bathdimmer_tasmota
            - light.bathswitch_tasmota
            - light.bed_led
            - light.bedroom_light
            - light.lukelamp_tasmota
            - light.rhodalamp_tasmota
            - light.fan_light
            - light.diningroom_switch_tasmota
            - light.kitchen_dimmer_tasmota
            - light.sw_kitchen_tasmota
            - light.livingroom_dimmer_tasmota
            - light.livingroom_dimmer_2_tasmota
            - light.driveway_sw_tasmota
            - light.back_yard_sw_tasmota
            - light.garage_inside_tasmota
            - light.shoplightsint_tasmota
            - light.shoplightsext_tasmota
            - light.pool_lights
            - light.pool_led
      - service: switch.turn_off
        target:
          entity_id: &off_light_switches
            - switch.kitchen_acc_tasmota
            - switch.dinning_acc_tasmota

  panel_good_night:
    alias: "Good Night"
    icon: mdi:weather-night
    mode: single
    sequence:
      - service: cover.close_cover
        target:
          entity_id:
            - cover.garage_door_1
            - cover.garage_door_2
            - cover.garage_door_3
      - service: light.turn_off
        target:
          entity_id: *off_lights
      - service: switch.turn_off
        target:
          entity_id: *off_light_switches
      # Kitchen WLED to the red nightlight (same as the 10:30pm automation in
      # evening_schedule.yaml); Bathroom LED is left as it is.
      - service: light.turn_on
        target:
          entity_id: light.kitchen_kitchen_leds
        data:
          rgb_color: [255, 0, 0]
          brightness: 100
      - service: switch.turn_on
        target:
          entity_id: switch.kitchen_kitchen_leds_nightlight

  panel_movie:
    alias: "Movie"
    icon: mdi:movie-open
    mode: restart
    sequence:
      # Dining room goes off at the same moment the living room starts its
      # fade; kitchen and foyer are left alone.
      - parallel:
          - sequence:
              - service: light.turn_off
                target:
                  entity_id: light.diningroom_switch_tasmota
              - service: switch.turn_off
                target:
                  entity_id: switch.dinning_acc_tasmota
          # Only Dimmer 1: Dimmer 2 is in the same device group ("livin") and
          # follows it, so fading both would make them fight each other.
          - service: script.panel_fade_off
            data:
              entity: light.livingroom_dimmer_tasmota

  # Fades a dimmer from its current brightness down to 1%, then turns it off.
  # The brighter it starts, the longer it takes: 1 s + 0.04 s per percent
  # (100% -> 5 s, 50% -> 3 s, 25% -> 2 s). Steps every 0.4 s; the dimmer's
  # own short fade blends them into a smooth glide. Does nothing if it's
  # already off.
  panel_fade_off:
    alias: "Panel - fade a dimmer off"
    mode: parallel
    fields:
      entity:
        description: Light to fade off
        example: light.livingroom_dimmer_tasmota
    sequence:
      - condition: template
        value_template: "{{ is_state(entity, 'on') }}"
      - variables:
          start: "{{ ((state_attr(entity, 'brightness') or 255) / 255 * 100) | round(0) | int }}"
          interval_ms: 400
          duration_ms: "{{ (1000 + start * 40) | int }}"
          steps: "{{ [ (duration_ms / interval_ms) | round(0) | int, 2 ] | max }}"
      - repeat:
          count: "{{ steps }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ entity }}"
              data:
                brightness_pct: "{{ [ (start - (start - 1) * repeat.index / steps) | round(0) | int, 1 ] | max }}"
            - delay:
                milliseconds: "{{ interval_ms }}"
      - service: light.turn_off
        target:
          entity_id: "{{ entity }}"
